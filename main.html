<div id="lvl">Уровень 1</div>
<div id="time">30с</div>
<div id="grid"></div>
<button id="start">СТАРТ</button>
<style>
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px}
.item{font-size:40px;padding:20px;border-radius:12px;border:none;
background:#fff3;cursor:pointer;transition:.1s}
.item:active{transform:scale(.9)}
</style>
<script>
let saved=0,time=30,timer,running=false;
const grid=document.getElementById('grid');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const items=['💡','📺','☕','🔥'];
const names=['Свет','Телевизор','Чайник','Обогреватель'];

function spawn(){
  const i=Math.floor(Math.random()*4);
  const div=document.createElement('button');
  div.className='item';
  div.textContent=items[i];
  div.title=names[i];
  div.onclick=()=>{saved+=3;update();div.remove();};
  grid.appendChild(div);
  setTimeout(()=>{if(div.parentNode){saved=Math.max(0,saved-5);update();div.remove();}},2000);
}

function update(){
  scoreEl.textContent=`⚡ ${saved} кВт·ч`;
  const lvl=Math.floor(saved/15)+1;
  document.getElementById('lvl').textContent=`Уровень ${lvl}`;
}

document.getElementById('start').onclick=()=>{
  if(running)return;
  running=true;saved=0;time=30;update();
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;timeEl.textContent=time+'с';
    if(time%Math.max(1,4-Math.floor(saved/15))===0)spawn();
    if(time<=0){clearInterval(timer);running=false;
      alert(`Игра окончена! Ты сэкономил ${saved} кВт·ч 🌱`);}
  },1000);
  timeEl.textContent='30с';
};
</script>
