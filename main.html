<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЭнергоХранитель</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f2027;color:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
min-height:100vh;padding-top:30px}
h1{margin:0 0 10px}
#hud{display:flex;gap:25px;font-size:20px;margin-bottom:15px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px}
.item{font-size:42px;padding:22px;border-radius:14px;border:none;
background:rgba(255,255,255,.2);cursor:pointer;transition:.1s}
.item:active{transform:scale(.9)}
#start{padding:15px 45px;font-size:20px;border:none;border-radius:12px;
background:#00c853;color:#fff;cursor:pointer;transition:.2s;margin-top:10px}
#start:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>⚡ ЭнергоХранитель</h1>
<div id="hud">
  <div id="lvl">Уровень 1</div>
  <div id="score">⚡ 0 кВт·ч</div>
  <div id="time">30с</div>
</div>
<div id="grid"></div>
<button id="start">СТАРТ</button>

<script>
let saved=0,time=30,timer,running=false;
const grid=document.getElementById('grid');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const items=['💡','📺','☕','🔥'];
const names=['Свет','Телевизор','Чайник','Обогреватель'];

function spawn(){
  const i=Math.floor(Math.random()*4);
  const div=document.createElement('button');
  div.className='item';div.textContent=items[i];div.title=names[i];
  div.onclick=()=>{saved+=3;update();div.remove();};
  grid.appendChild(div);
  setTimeout(()=>{if(div.parentNode){saved=Math.max(0,saved-5);update();div.remove();}},2000);
}
function update(){
  scoreEl.textContent=`⚡ ${saved} кВт·ч`;
  document.getElementById('lvl').textContent=`Уровень ${Math.floor(saved/15)+1}`;
}
document.getElementById('start').onclick=()=>{
  if(running)return;
  running=true;saved=0;time=30;update();timeEl.textContent='30с';
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;timeEl.textContent=time+'с';
    if(time%Math.max(1,4-Math.floor(saved/15))===0) spawn();
    if(time<=0){clearInterval(timer);running=false;
      alert(`Игра окончена! Ты сэкономил ${saved} кВт·ч 🌱`);}
  },1000);
};
</script>
</body>
</html>
